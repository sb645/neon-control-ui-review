<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON</title>
<style>
:root{color-scheme:dark;--bg:#0b0b12;--text:#f8f8ff;--muted:#969bb3;--cyan:#19f0ff;--mag:#ff3df0;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06);--glow:0 0 16px rgba(25,240,255,.46),0 0 38px rgba(255,61,240,.28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(25,240,255,.15),transparent 30%),radial-gradient(circle at 88% 12%,rgba(255,61,240,.18),transparent 32%),var(--bg);font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;color:var(--text);display:grid;place-items:center;padding:12px}
button,input{font:inherit}button{cursor:pointer}
.app{width:min(440px,100%);display:flex;flex-direction:column;gap:11px}
.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px}.brand{font-size:24px;font-weight:850;letter-spacing:.08em}.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 10px;white-space:nowrap}.badge b{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.power{width:58px;height:58px;border:1px solid rgba(25,240,255,.48);border-radius:18px;background:linear-gradient(180deg,rgba(25,240,255,.15),rgba(255,61,240,.08));color:#fff;box-shadow:var(--glow);display:grid;place-items:center}.power.off{box-shadow:none;border-color:var(--line);background:var(--glass);color:#9ca}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border-radius:17px;padding:13px;box-shadow:0 18px 50px rgba(0,0,0,.32)}
.preview{height:118px;position:relative;overflow:hidden}.tube{position:absolute;left:18px;right:18px;top:47px;height:23px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 8px var(--c1),0 0 30px var(--c1),0 0 72px rgba(255,61,240,.44);opacity:var(--op,.76);transform:scaleX(var(--dir,1))}.tube:before{content:"";position:absolute;inset:4px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.78),rgba(255,255,255,.06),rgba(255,255,255,.46));mix-blend-mode:screen;opacity:.58}.tube:after{content:"";position:absolute;inset:-18px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--c2),var(--c1),transparent);filter:blur(16px);opacity:.58}
.preview[data-preset="2"] .tube,.preview[data-preset="7"] .tube{background:linear-gradient(90deg,var(--c1),var(--c2),#ffe05c,#38ff95,var(--c1));background-size:230% 100%;animation:flow var(--dur,2s) linear infinite}.preview[data-preset="3"] .tube:after{animation:slide var(--dur,1.5s) linear infinite;opacity:.9}.preview[data-preset="4"] .tube{animation:pulse var(--dur,1s) ease-in-out infinite}.preview[data-preset="5"] .tube{animation:breath var(--dur,2s) ease-in-out infinite}.preview[data-preset="6"] .tube{animation:music var(--dur,.6s) ease-in-out infinite}.preview[data-preset="8"] .tube{background:#ffb25c;box-shadow:0 0 8px #ffb25c,0 0 24px rgba(255,178,92,.48)}
@keyframes flow{to{background-position:230% 0}}@keyframes slide{from{transform:translateX(-75%)}to{transform:translateX(75%)}}@keyframes pulse{50%{filter:brightness(1.8);transform:scaleY(1.12)}}@keyframes breath{50%{filter:brightness(.45);opacity:.58}}@keyframes music{25%{transform:scaleY(1.38)}60%{transform:scaleY(.82)}}
.hint{position:absolute;left:13px;bottom:10px;color:var(--muted);font-size:12px}.block{display:grid;gap:10px}.blockhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.blockhead h2{margin:0;font-size:15px}.blockhead span{font-size:11px;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preset,.chip,.save,.toggle{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.055);color:var(--text)}.preset{min-height:58px;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;padding:9px}.preset.active,.chip.active,.toggle.on{border-color:rgba(25,240,255,.78);box-shadow:var(--glow);background:linear-gradient(135deg,rgba(25,240,255,.18),rgba(255,61,240,.12))}.ico{width:27px;height:27px;color:var(--cyan);filter:drop-shadow(0 0 8px rgba(25,240,255,.75))}.cn{font-size:14px;font-weight:780}.en{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.section{display:grid;gap:10px}.row{display:grid;grid-template-columns:72px 1fr 42px;gap:10px;align-items:center}.label{font-size:14px;color:#dfe2f2}.val{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--cyan)}
.swatches,.palettes,.actions,.modes{display:flex;gap:8px;flex-wrap:wrap}.modes{display:grid;grid-template-columns:1fr 1fr 1fr}.mode{min-height:38px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.055);color:#dfe2f2}.mode.active{border-color:rgba(25,240,255,.78);box-shadow:var(--glow);background:linear-gradient(135deg,rgba(25,240,255,.18),rgba(255,61,240,.12))}.pickpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pickcard{border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(255,255,255,.045);display:grid;gap:8px}.pickcard.hide{display:none}.picktop{display:flex;align-items:center;justify-content:space-between;color:#dfe2f2;font-size:13px}.bigpick{width:54px;height:38px;border:0;background:transparent;padding:0}.sw{width:34px;height:34px;border:1px solid rgba(255,255,255,.32);border-radius:12px;background:var(--c);box-shadow:0 0 16px var(--c)}.sw.active{outline:2px solid #fff;outline-offset:2px}.chip{min-height:36px;padding:0 11px;color:#dfe2f2}.save,.toggle{min-height:42px;padding:0 12px}.save{flex:1}.small{font-size:12px;color:var(--muted);line-height:1.45}.hide{display:none}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-14px);opacity:0;background:#171927;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;transition:.24s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.foot{text-align:center;font-size:12px;color:var(--muted)}.foot a{color:#aeb3c8;text-decoration:none}
@media(max-width:390px){body{padding:9px}.app{gap:9px}.card{padding:11px}.preview{height:108px}.tube{top:42px}.preset{min-height:56px;padding:8px}.power{width:54px;height:54px}.brand{font-size:21px}.badge{font-size:11px;padding:7px 8px}.row{grid-template-columns:64px 1fr 38px}}
</style>
</head>
<body>
<main class="app">
<section class="top"><div class="brand">NEON</div><div class="badge" id="badge"><b>●</b> 演示模式</div><button class="power" id="power" aria-label="Power"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v10"/><path d="M6.8 5.8a8 8 0 1 0 10.4 0"/></svg></button></section>
<section class="card preview" id="preview" data-preset="1"><div class="tube" id="tube"></div><div class="hint" id="modeText">纯色 · Static</div></section>
<section class="card block"><div class="blockhead"><h2>1 选择场景</h2><span>先选氛围，再微调</span></div><div class="grid" id="presets"></div></section>
<section class="card section"><div class="blockhead"><h2>2 调整当前效果</h2><span>颜色、速度、强度</span></div>
<div class="row"><div class="label">亮度</div><input id="bri" type="range" min="0" max="100" value="72"><div class="val" id="briVal">72%</div></div>
<div id="colorBox"><div class="label">颜色</div><div class="modes"><button class="mode active" data-cmode="single">单色</button><button class="mode" data-cmode="dual">双色</button><button class="mode" data-cmode="theme">主题</button></div><div class="pickpair"><div class="pickcard"><div class="picktop"><span>主色</span><input class="bigpick" id="pick1" type="color" value="#19f0ff" aria-label="主色"></div><div class="swatches" id="sw1"></div></div><div class="pickcard" id="accentCard"><div class="picktop"><span>辅色</span><input class="bigpick" id="pick2" type="color" value="#ff3df0" aria-label="辅色"></div><div class="swatches" id="sw2"></div></div></div></div>
<div id="paletteBox"><div class="label">主题</div><div class="palettes" id="palettes"></div></div>
<div class="row" id="speedBox"><div class="label">速度</div><input id="spd" type="range" min="0" max="100" value="55"><div class="val" id="spdVal">55%</div></div>
<div class="row" id="intBox"><div class="label">强度</div><input id="int" type="range" min="0" max="100" value="55"><div class="val" id="intVal">55%</div></div>
<div class="actions"><button class="toggle" id="reverse">反向流动</button></div>
<div class="small">单色适合 Logo 常亮；双色适合流星、呼吸、脉冲；主题适合彩虹、派对和音乐律动。</div>
</section>
<section class="card section"><div class="blockhead"><h2>3 保存与定时</h2><span>日常使用入口</span></div><div class="actions"><button class="toggle" id="sleep">30 分钟后关闭</button><button class="save" id="save">保存当前效果</button></div><div class="small">保存会写入“我的场景”，下次可以直接调用；定时适合睡前或店铺打烊。</div>
</section>
<footer class="foot"><a href="/">高级设置 →</a></footer>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
var presets=[[1,"纯色","Static","M5 12h14"],[2,"彩虹流动","Rainbow Flow","M4 13c3-4 13-4 16 0s1 3 4 0 13-4 16 0 1-3 4-4"],[3,"流星","Comet","M4 16l6-8 4 4 6-6"],[4,"脉冲","Pulse","M3 12h4l2-6 4 12 2-6h5"],[5,"呼吸","Breathing","M12 5c4 3 6 5 6 8a6 6 0 0 1-12 0c0-3 2-5 6-8z"],[6,"音乐律动","Music","M5 17V7m4 10V4m4 13V8m4 9V6"],[7,"派对","Party","M5 5l14 14M19 5L5 19M12 3v18"],[8,"夜间","Night","M15 4a8 8 0 1 0 5 12 7 7 0 0 1-5-12z"]];
var pals=[[0,"默认"],[4,"渐变"],[6,"派对"],[9,"海洋"],[11,"彩虹"],[13,"日落"]];
var colors=["#19f0ff","#ff3df0","#ffffff","#ff4a4a","#38ff95","#ffb25c"];
var st={on:true,preset:1,bri:72,c1:"#19f0ff",c2:"#ff3df0",cmode:"single",speed:55,intensity:55,pal:11,rev:false,sleep:false};
var $=function(id){return document.getElementById(id)},adapter;
function pct(v){return Math.round(Math.max(0,Math.min(100,+v||0))*255/100)}
function hex(a){return"#"+a.slice(0,3).map(function(n){return("0"+n.toString(16)).slice(-2)}).join("")}
function rgb(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function post(b){return fetch("/json/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){try{return r.json()}catch(e){return null}})}
function timeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(Error("timeout"))},ms)})])}
function bodyColor(){var c2=st.cmode==="dual"?st.c2:st.c1;return{seg:[{col:[rgb(st.c1),rgb(c2)]}]}}
function bodyTune(){return{seg:[{sx:pct(st.speed),ix:pct(st.intensity),pal:st.pal,rev:st.rev}]}}
function log(b){console.log("WLED",b)}
function MockAdapter(){}MockAdapter.prototype={init:function(){return Promise.resolve()},isLive:function(){return false},setPower:function(){log({on:"t"});return Promise.resolve()},setBrightness:function(v){log({bri:pct(v)});return Promise.resolve()},applyPreset:function(id){log({ps:id});return Promise.resolve()},setColor:function(){log(bodyColor());return Promise.resolve()},setSpeed:function(v){log({seg:[{sx:pct(v)}]});return Promise.resolve()},setIntensity:function(v){log({seg:[{ix:pct(v)}]});return Promise.resolve()},setPalette:function(id){log({seg:[{pal:id}]});return Promise.resolve()},setReverse:function(v){log({seg:[{rev:v}]});return Promise.resolve()},setSleep:function(v){log({nl:{on:v,dur:30,mode:1,tbri:0}});return Promise.resolve()},saveScene:function(){log({psave:9,ib:true,sb:true,sc:true});return Promise.resolve()}};
function WledAdapter(){}WledAdapter.prototype={init:function(){return fetch("/json/state").then(function(r){return r.json()}).then(sync)},isLive:function(){return true},setPower:function(){return post({on:"t",v:true}).then(sync)},setBrightness:function(v){return post({bri:pct(v)})},applyPreset:function(id){return post({ps:id})},setColor:function(){return post(bodyColor())},setSpeed:function(v){return post({seg:[{sx:pct(v)}]})},setIntensity:function(v){return post({seg:[{ix:pct(v)}]})},setPalette:function(id){return post({seg:[{pal:id}]})},setReverse:function(v){return post({seg:[{rev:v}]})},setSleep:function(v){return post({nl:{on:v,dur:30,mode:1,tbri:0}})},saveScene:function(){return post({psave:9,ib:true,sb:true,sc:true})}};
function sync(s){if(!s)return;if(typeof s.on==="boolean")st.on=s.on;if(typeof s.bri==="number")st.bri=Math.round(s.bri/255*100);if(typeof s.ps==="number"&&s.ps>0&&s.ps<9)st.preset=s.ps;var g=s.seg&&s.seg[0];if(g){if(g.col&&g.col[0])st.c1=hex(g.col[0]);if(g.col&&g.col[1])st.c2=hex(g.col[1]);if(typeof g.sx==="number")st.speed=Math.round(g.sx/255*100);if(typeof g.ix==="number")st.intensity=Math.round(g.ix/255*100);if(typeof g.pal==="number")st.pal=g.pal;if(typeof g.rev==="boolean")st.rev=g.rev}}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1700)}
function send(fn,msg){return Promise.resolve(fn()).then(function(){if(msg)toast(msg)}).catch(function(){toast("控制失败，已切回演示模式");adapter=new MockAdapter();setBadge()})}
function setBadge(){var live=adapter&&adapter.isLive();$("badge").innerHTML="<b>●</b> "+(live?"已连接":"演示模式")}
function draw(){var h="";presets.forEach(function(p){h+='<button class="preset" data-id="'+p[0]+'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="'+p[3]+'"/></svg><span><span class="cn">'+p[1]+'</span><span class="en">'+p[2]+'</span></span></button>'});$("presets").innerHTML=h;h="";pals.forEach(function(p){h+='<button class="chip" data-pal="'+p[0]+'">'+p[1]+"</button>"});$("palettes").innerHTML=h;["sw1","sw2"].forEach(function(id){var x="";colors.forEach(function(c){x+='<button class="sw" style="--c:'+c+'" data-color="'+c+'" aria-label="'+c+'"></button>'});$(id).innerHTML=x})}
function ui(){document.body.classList.toggle("off",!st.on);$("power").classList.toggle("off",!st.on);$("preview").dataset.preset=st.preset;var p=presets[st.preset-1],c2=st.cmode==="dual"?st.c2:st.c1;$("modeText").textContent=p[1]+" · "+p[2];$("tube").style.setProperty("--c1",st.c1);$("tube").style.setProperty("--c2",c2);$("tube").style.setProperty("--op",st.on?Math.max(.18,st.bri/100):.1);$("tube").style.setProperty("--dur",Math.max(.45,3-st.speed/42)+"s");$("tube").style.setProperty("--dir",st.rev?-1:1);$("bri").value=st.bri;$("briVal").textContent=st.bri+"%";$("spd").value=st.speed;$("spdVal").textContent=st.speed+"%";$("int").value=st.intensity;$("intVal").textContent=st.intensity+"%";$("pick1").value=st.c1;$("pick2").value=st.c2;$("accentCard").classList.toggle("hide",st.cmode!=="dual");$("paletteBox").classList.toggle("hide",st.cmode!=="theme");$("speedBox").classList.toggle("hide",st.preset===1||st.preset===8);$("intBox").classList.toggle("hide",st.preset===1||st.preset===8);$("reverse").classList.toggle("on",st.rev);$("sleep").classList.toggle("on",st.sleep);document.querySelectorAll(".preset").forEach(function(b){b.classList.toggle("active",+b.dataset.id===st.preset)});document.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("active",+b.dataset.pal===st.pal)});document.querySelectorAll(".mode").forEach(function(b){b.classList.toggle("active",b.dataset.cmode===st.cmode)});document.querySelectorAll("#sw1 .sw").forEach(function(b){b.classList.toggle("active",b.dataset.color===st.c1)});document.querySelectorAll("#sw2 .sw").forEach(function(b){b.classList.toggle("active",b.dataset.color===st.c2)})}
function bind(){draw();$("power").onclick=function(){st.on=!st.on;ui();send(function(){return adapter.setPower()},null)};$("presets").onclick=function(e){var b=e.target.closest(".preset");if(!b)return;st.preset=+b.dataset.id;if(st.preset===2||st.preset===7)st.cmode="theme";if(st.preset===1||st.preset===8)st.cmode="single";ui();send(function(){return adapter.applyPreset(st.preset).then(function(){return adapter.setColor()}).then(function(){return adapter.setSpeed(st.speed)}).then(function(){return adapter.setIntensity(st.intensity)}).then(function(){return adapter.setPalette(st.pal)}).then(function(){return adapter.setReverse(st.rev)})})};$("bri").oninput=function(){st.bri=+this.value;ui()};$("bri").onchange=function(){send(function(){return adapter.setBrightness(st.bri)})};$("spd").oninput=function(){st.speed=+this.value;ui()};$("spd").onchange=function(){send(function(){return adapter.setSpeed(st.speed)})};$("int").oninput=function(){st.intensity=+this.value;ui()};$("int").onchange=function(){send(function(){return adapter.setIntensity(st.intensity)})};document.querySelector(".modes").onclick=function(e){var b=e.target.closest(".mode");if(!b)return;st.cmode=b.dataset.cmode;ui();send(function(){return st.cmode==="theme"?adapter.setPalette(st.pal):adapter.setColor()})};$("sw1").onclick=function(e){var b=e.target.closest(".sw");if(!b)return;st.c1=b.dataset.color;ui();send(function(){return adapter.setColor()})};$("sw2").onclick=function(e){var b=e.target.closest(".sw");if(!b)return;st.c2=b.dataset.color;ui();send(function(){return adapter.setColor()})};$("pick1").onchange=function(){st.c1=this.value;ui();send(function(){return adapter.setColor()})};$("pick2").onchange=function(){st.c2=this.value;ui();send(function(){return adapter.setColor()})};$("palettes").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;st.cmode="theme";st.pal=+b.dataset.pal;ui();send(function(){return adapter.setPalette(st.pal)})};$("reverse").onclick=function(){st.rev=!st.rev;ui();send(function(){return adapter.setReverse(st.rev)})};$("sleep").onclick=function(){st.sleep=!st.sleep;ui();send(function(){return adapter.setSleep(st.sleep)},st.sleep?"已设置 30 分钟后关闭":"已取消定时")};$("save").onclick=function(){send(function(){return adapter.saveScene()},"已保存到我的场景")}}
function boot(){bind();timeout(fetch("/json/info"),2000).then(function(r){if(!r.ok)throw Error("offline");adapter=new WledAdapter();return adapter.init()}).catch(function(){adapter=new MockAdapter();return adapter.init()}).then(function(){setBadge();ui()})}
boot();
})();
</script>
</body>
</html>
